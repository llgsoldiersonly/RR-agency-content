<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Single-slide renderer — exact 1080×1440 dimensions for Puppeteer
     to screenshot. No chrome, no margins, no scrollbars. */
  :root {
    --slide-navy: #0B2A4A; --slide-navy-deep: #06192E;
    --brass: #C8A24B; --brass-bright: #E4BC60; --brass-deep: #9C7E36;
    --slide-paper: #F5F1E8; --slide-paper-deep: #EFEAD8;
    --slide-ink: #0D1B2F; --slide-ink-mid: #4A5468;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; background: transparent; }
  body { font-family: "Inter", sans-serif; }
  .slide {
    width: 1080px; height: 1440px;
    position: relative; overflow: hidden;
    container-type: inline-size;
  }
  .slide.dark { background: var(--slide-navy); color: var(--slide-paper); background-image: radial-gradient(140% 100% at 50% 0%, rgba(255,255,255,.05), transparent 55%); }
  .slide.dark.deep { background: var(--slide-navy-deep); }
  .slide.light { background: var(--slide-paper); color: var(--slide-ink); }

  .frame {
    position: absolute; inset: 0;
    padding: 8.5cqw 7cqw 12cqw 7cqw;
    display: flex; flex-direction: column;
    justify-content: center;
  }
  .num {
    position: absolute; top: 3.5cqw; left: 3.5cqw;
    width: 4cqw; height: 4cqw; background: var(--brass);
    color: var(--slide-navy); font-weight: 900;
    font-size: 2cqw; line-height: 4cqw; text-align: center;
    border-radius: 0.5cqw;
  }
  .brand { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 0.8cqw; padding-top: 2cqw; }
  .brand .mark { font-family: "Fraunces",serif; font-weight: 900; font-size: 3.8cqw; color: var(--brass); }
  .slide.light .brand .mark { color: var(--slide-navy); }
  .brand .mark em { font-style: normal; font-weight: 500; }
  .brand .subline { font-family: "Inter",sans-serif; font-weight: 700; font-size: 1.3cqw; letter-spacing: 0.3em; text-transform: uppercase; color: var(--brass-deep); border-top: 0.1cqw solid var(--brass); padding-top: 0.6cqw; }

  .closer { text-align: left; font-family: "Inter",sans-serif; font-weight: 800; font-size: 2.4cqw; line-height: 1.15; text-transform: uppercase; margin-top: 3cqw; }
  .slide.dark .closer { color: var(--slide-paper); }
  .slide.light .closer { color: var(--slide-navy); }
  .closer em { font-style: normal; color: var(--brass); }
  .slide.light .closer em { color: var(--brass-deep); }
  .closer-banner { align-self: flex-start; background: var(--brass); color: var(--slide-navy); font-family: "Inter",sans-serif; font-weight: 900; font-size: 2.4cqw; text-transform: uppercase; padding: 1.4cqw 3cqw; border-radius: 0.6cqw; margin-top: 3cqw; }

  .slide[data-layout="hero"] { background: var(--slide-navy-deep); }
  .slide[data-layout="hero"] .body { margin: auto 0; padding-top: 6cqw; }
  .slide[data-layout="hero"] .lede { font-family: "Inter",sans-serif; font-weight: 600; font-size: 2cqw; letter-spacing: 0.04em; color: var(--slide-paper); opacity: 0.85; text-transform: uppercase; margin-bottom: 2.4cqw; }
  .slide[data-layout="hero"] .h1 { font-family: "Fraunces",serif; font-weight: 900; font-size: 8.6cqw; line-height: 0.94; letter-spacing: -0.032em; color: #fff; }
  .slide[data-layout="hero"] .h1 em { font-style: normal; color: var(--brass); }
  .slide[data-layout="hero"] .sub { margin-top: 3cqw; font-family: "Inter",sans-serif; font-weight: 500; font-size: 2.4cqw; line-height: 1.35; color: var(--slide-paper); opacity: 0.92; max-width: 88%; }
  .slide[data-layout="hero"] .sub strong { color: var(--brass-bright); font-weight: 800; }
  .slide[data-layout="hero"] .closer { color: var(--slide-paper); opacity: 0.7; font-size: 1.6cqw; letter-spacing: 0.18em; margin-top: 4cqw; text-align: center; }

  .slide[data-layout="brutal-truth"] { text-align: center; }
  .slide[data-layout="brutal-truth"] .h1 { margin-top: 1cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5.6cqw; line-height: 1; letter-spacing: -0.025em; color: var(--slide-navy); text-align: center; }
  .slide[data-layout="brutal-truth"] .h1 em { font-style: normal; color: var(--brass-deep); }
  .slide[data-layout="brutal-truth"] .sub { margin: 1.8cqw auto 0; font-family: "Inter",sans-serif; font-weight: 500; font-size: 2.3cqw; line-height: 1.35; color: var(--slide-ink-mid); max-width: 86%; text-align: center; }
  .slide[data-layout="brutal-truth"] .sub strong { color: var(--slide-navy); font-weight: 800; }
  .slide[data-layout="brutal-truth"] .heading { margin-top: 3.6cqw; font-family: "Inter",sans-serif; font-weight: 900; font-size: 2.2cqw; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass-deep); text-align: center; }
  .slide[data-layout="brutal-truth"] .heading::after { content:""; display:block; width: 5cqw; height: 0.3cqw; background: var(--brass); margin: 0.8cqw auto 0; }
  .slide[data-layout="brutal-truth"] ul.x-list { margin-top: 2.6cqw; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 2cqw; align-items: center; }
  .slide[data-layout="brutal-truth"] ul.x-list li { display: flex; align-items: center; gap: 1.8cqw; font-family: "Inter",sans-serif; font-weight: 700; font-size: 2.5cqw; color: var(--slide-navy); }
  .slide[data-layout="brutal-truth"] .closer { text-align: center; }

  .x-circle { flex-shrink: 0; width: 3.4cqw; height: 3.4cqw; border-radius: 50%; background: var(--brass); display: flex; align-items: center; justify-content: center; }
  .x-circle svg { width: 1.8cqw; height: 1.8cqw; }
  .check-circle { flex-shrink: 0; width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: var(--brass); display: flex; align-items: center; justify-content: center; margin-top: 0.3cqw; }
  .check-circle svg { width: 1.4cqw; height: 1.4cqw; }

  .slide[data-layout="free-guide"] .banner-top { align-self: center; background: var(--brass); color: var(--slide-navy); font-family: "Inter",sans-serif; font-weight: 900; font-size: 3.2cqw; letter-spacing: 0.03em; text-transform: uppercase; padding: 1.4cqw 3cqw; border-radius: 0.5cqw; margin-top: 4cqw; }
  .slide[data-layout="free-guide"] .caption { text-align: center; margin-top: 3cqw; font-family: "Inter",sans-serif; font-weight: 700; font-size: 1.8cqw; letter-spacing: 0.16em; text-transform: uppercase; color: var(--slide-paper); opacity: 0.85; }
  .slide[data-layout="free-guide"] .h1 { text-align: center; margin-top: 1.2cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5.6cqw; line-height: 1; letter-spacing: -0.025em; color: #fff; }
  .slide[data-layout="free-guide"] .h1 em { font-style: normal; color: var(--brass); }
  .slide[data-layout="free-guide"] .grid { margin-top: 4cqw; display: grid; grid-template-columns: 1fr 0.6fr; gap: 3cqw; align-items: center; }
  .slide[data-layout="free-guide"] .inside { font-family: "Inter",sans-serif; font-weight: 900; font-size: 1.7cqw; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); margin-bottom: 1.6cqw; }
  .slide[data-layout="free-guide"] ul.check-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.8cqw; }
  .slide[data-layout="free-guide"] ul.check-list li { display: flex; align-items: flex-start; gap: 1.4cqw; font-family: "Inter",sans-serif; font-weight: 600; font-size: 1.9cqw; line-height: 1.3; color: var(--slide-paper); }
  .slide[data-layout="free-guide"] .book { width: 100%; aspect-ratio: 3/4; background: #0d2440; border: 0.4cqw solid var(--brass); box-shadow: 1.5cqw 1.5cqw 0 -0.4cqw var(--brass); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2cqw; text-align: center; }
  .slide[data-layout="free-guide"] .book-title { font-family: "Fraunces",serif; font-weight: 900; font-size: 1.7cqw; line-height: 1.1; color: #fff; }
  .slide[data-layout="free-guide"] .book-title em { font-style: normal; color: var(--brass-bright); }
  .slide[data-layout="free-guide"] .book-mark { margin-top: 1.6cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 1.4cqw; color: var(--brass); }
  .slide[data-layout="free-guide"] .closer-banner { align-self: center; }

  .slide[data-layout="big-stat"] .stat-caption { margin-top: 5cqw; text-align: center; font-family: "Inter",sans-serif; font-weight: 800; font-size: 1.8cqw; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass-deep); }
  .slide[data-layout="big-stat"] .bignum { text-align: center; margin-top: 1cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 16cqw; line-height: 1; letter-spacing: -0.045em; color: var(--slide-navy); }
  .slide[data-layout="big-stat"] .bignum em { font-style: normal; color: var(--brass-deep); }
  .slide[data-layout="big-stat"] .stat-label { text-align: center; margin-top: 1.4cqw; font-family: "Inter",sans-serif; font-weight: 800; font-size: 2.2cqw; letter-spacing: 0.04em; text-transform: uppercase; color: var(--slide-navy); }
  .slide[data-layout="big-stat"] .badges { margin-top: 5cqw; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1cqw; }
  .slide[data-layout="big-stat"] .badge { display: flex; flex-direction: column; align-items: center; gap: 1.2cqw; padding: 1cqw; }
  .slide[data-layout="big-stat"] .badge .b-icon { width: 6cqw; height: 6cqw; border-radius: 50%; background: var(--slide-paper-deep); border: 0.25cqw solid var(--brass); display: flex; align-items: center; justify-content: center; }
  .slide[data-layout="big-stat"] .badge .b-icon svg { width: 3.2cqw; height: 3.2cqw; }
  .slide[data-layout="big-stat"] .badge .b-label { text-align: center; font-family: "Inter",sans-serif; font-weight: 800; font-size: 1.4cqw; line-height: 1.2; color: var(--slide-navy); }
  .slide[data-layout="big-stat"] .body-text { margin: 3cqw auto 0; text-align: center; font-family: "Inter",sans-serif; font-weight: 500; font-size: 1.8cqw; line-height: 1.4; color: var(--slide-ink-mid); max-width: 88%; }
  .slide[data-layout="big-stat"] .body-text strong { color: var(--slide-navy); font-weight: 800; }

  .slide[data-layout="common-mistakes"] .h1 { margin-top: 1cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5cqw; line-height: 1.05; letter-spacing: -0.022em; color: #fff; text-align: center; }
  .slide[data-layout="common-mistakes"] .h1 em { font-style: normal; color: var(--brass); }
  .slide[data-layout="common-mistakes"] ul.pill-list { margin-top: 3cqw; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.8cqw; align-items: center; }
  .slide[data-layout="common-mistakes"] ul.pill-list li { display: flex; align-items: center; gap: 1.8cqw; background: rgba(245,241,232,0.06); border: 0.15cqw solid rgba(200,162,75,0.25); border-radius: 1.2cqw; padding: 1.8cqw 2.2cqw; font-family: "Inter",sans-serif; font-weight: 700; font-size: 2.1cqw; color: var(--slide-paper); }
  .slide[data-layout="common-mistakes"] .closer { text-align: center; }

  .slide[data-layout="three-steps"] .h1 { margin-top: 1cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5cqw; line-height: 1; letter-spacing: -0.022em; color: var(--slide-navy); text-align: center; }
  .slide[data-layout="three-steps"] .h1 em { font-style: normal; color: var(--brass-deep); }
  .slide[data-layout="three-steps"] ol.steps { margin-top: 3.4cqw; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 2.4cqw; align-items: center; }
  .slide[data-layout="three-steps"] ol.steps li { display: grid; grid-template-columns: 5cqw 6cqw 1fr; gap: 1.6cqw; align-items: center; max-width: 90%; }
  .step-num-square { width: 5cqw; height: 5cqw; background: var(--brass); color: var(--slide-navy); border-radius: 0.8cqw; display: flex; align-items: center; justify-content: center; font-family: "Fraunces",serif; font-weight: 900; font-size: 2.6cqw; line-height: 1; }
  .step-circle { width: 6cqw; height: 6cqw; border-radius: 50%; background: var(--slide-navy); display: flex; align-items: center; justify-content: center; color: var(--brass); }
  .step-circle svg { width: 2.8cqw; height: 2.8cqw; }
  .slide[data-layout="three-steps"] .step-body { font-family: "Inter",sans-serif; font-weight: 700; font-size: 2cqw; line-height: 1.25; color: var(--slide-navy); }
  .slide[data-layout="three-steps"] .step-body strong { color: var(--brass-deep); }
  .slide[data-layout="three-steps"] .closer-banner { align-self: center; }

  .slide[data-layout="testimonials"] .h1 { text-align: center; margin-top: 1cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5cqw; line-height: 1.05; letter-spacing: -0.022em; color: #fff; }
  .slide[data-layout="testimonials"] .h1 em { font-style: normal; color: var(--brass); }
  .slide[data-layout="testimonials"] .cards { margin-top: 3cqw; display: flex; flex-direction: column; gap: 1.8cqw; }
  .slide[data-layout="testimonials"] .card { display: grid; grid-template-columns: 6cqw 1fr; gap: 2cqw; align-items: center; background: rgba(245,241,232,0.06); border: 0.15cqw solid rgba(200,162,75,0.2); border-radius: 1.4cqw; padding: 1.8cqw; }
  .slide[data-layout="testimonials"] .avatar { width: 6cqw; height: 6cqw; border-radius: 50%; background: linear-gradient(135deg, #2a4a6e, #6a8aa8); border: 0.25cqw solid var(--brass); display: flex; align-items: center; justify-content: center; color: var(--brass-bright); font-family: "Fraunces",serif; font-weight: 900; font-size: 2.6cqw; }
  .slide[data-layout="testimonials"] .quote { font-family: "Inter",sans-serif; font-weight: 600; font-size: 1.85cqw; line-height: 1.3; color: var(--slide-paper); }
  .slide[data-layout="testimonials"] .stars { color: var(--brass-bright); font-size: 1.5cqw; letter-spacing: 0.15em; margin-bottom: 0.3cqw; }

  .slide[data-layout="why-us"] .h1 { margin-top: 1cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5.2cqw; line-height: 1; letter-spacing: -0.025em; color: var(--slide-navy); text-align: center; }
  .slide[data-layout="why-us"] .h1 em { font-style: normal; color: var(--brass-deep); }
  .slide[data-layout="why-us"] ul.benefit-list { margin-top: 3cqw; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.8cqw; align-items: center; }
  .slide[data-layout="why-us"] ul.benefit-list li { display: flex; align-items: center; gap: 1.6cqw; font-family: "Inter",sans-serif; font-weight: 700; font-size: 2.05cqw; color: var(--slide-navy); }
  .benefit-check { flex-shrink: 0; width: 2.8cqw; height: 2.8cqw; border-radius: 50%; background: var(--slide-navy); display: flex; align-items: center; justify-content: center; }
  .benefit-check svg { width: 1.4cqw; height: 1.4cqw; }
  .slide[data-layout="why-us"] .closer-banner { align-self: center; }

  .slide[data-layout="urgency"] { background: var(--slide-navy-deep); }
  .slide[data-layout="urgency"] .clock-wrap { align-self: center; margin-top: 0; width: 16cqw; height: 16cqw; border-radius: 50%; border: 0.35cqw solid var(--brass); background: rgba(200,162,75,0.08); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 6cqw rgba(200,162,75,0.15); }
  .slide[data-layout="urgency"] .clock-wrap svg { width: 9cqw; height: 9cqw; }
  .slide[data-layout="urgency"] .h1 { text-align: center; margin-top: 3cqw; font-family: "Fraunces",serif; font-weight: 900; font-size: 5.4cqw; line-height: 1; letter-spacing: -0.025em; color: #fff; }
  .slide[data-layout="urgency"] .h1 em { font-style: normal; color: var(--brass); }
  .slide[data-layout="urgency"] .reasons { margin-top: 3cqw; display: flex; flex-direction: column; gap: 1.6cqw; }
  .slide[data-layout="urgency"] .reason { display: flex; align-items: center; gap: 1.6cqw; font-family: "Inter",sans-serif; font-weight: 600; font-size: 1.95cqw; color: var(--slide-paper); }
  .reason-icon { flex-shrink: 0; width: 3.4cqw; height: 3.4cqw; border-radius: 50%; background: rgba(245,241,232,0.08); border: 0.15cqw solid var(--brass); display: flex; align-items: center; justify-content: center; }
  .reason-icon svg { width: 1.8cqw; height: 1.8cqw; }
  .slide[data-layout="urgency"] .closer { text-align: center; }

  .slide[data-layout="cta"] .h1 { font-family: "Fraunces",serif; font-weight: 900; font-size: 4.4cqw; line-height: 1.02; letter-spacing: -0.022em; color: var(--slide-navy); max-width: 90%; }
  .slide[data-layout="cta"] .h1 em { font-style: normal; color: var(--brass-deep); }
  .slide[data-layout="cta"] .offer-block { margin-top: 2.4cqw; display: flex; flex-direction: column; align-items: flex-start; }
  .slide[data-layout="cta"] .offer-caption { font-family: "Inter",sans-serif; font-weight: 700; font-size: 2.2cqw; color: var(--slide-ink-mid); }
  .slide[data-layout="cta"] .offer-caption strong { color: var(--slide-navy); font-weight: 900; }
  .slide[data-layout="cta"] .offer-big { font-family: "Fraunces",serif; font-weight: 900; font-size: 13.5cqw; line-height: 0.9; letter-spacing: -0.045em; color: var(--brass-deep); margin-top: -0.4cqw; }
  .slide[data-layout="cta"] .offer-detail { margin-top: -0.6cqw; font-family: "Inter",sans-serif; font-weight: 800; font-size: 2.4cqw; line-height: 1.18; color: var(--slide-navy); }
  .slide[data-layout="cta"] .offer-detail em { font-style: normal; font-family: "Fraunces",serif; font-weight: 700; color: var(--brass-deep); }
  .slide[data-layout="cta"] .or-call { margin-top: 3cqw; font-family: "Inter",sans-serif; font-weight: 800; font-size: 1.5cqw; letter-spacing: 0.25em; text-transform: uppercase; color: var(--slide-ink-mid); }
  .slide[data-layout="cta"] .phone-button { margin-top: 1.2cqw; display: flex; align-items: center; gap: 1.6cqw; background: var(--brass); color: var(--slide-navy); padding: 2.2cqw 3cqw; border-radius: 1.2cqw; font-family: "Inter",sans-serif; font-weight: 900; font-size: 3.6cqw; width: fit-content; box-shadow: 0 1.2cqw 2.2cqw -0.8cqw rgba(200,162,75,0.5); }
  .slide[data-layout="cta"] .phone-button svg { width: 3.2cqw; height: 3.2cqw; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS = {
  x:        '<svg viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
  check:    '<svg viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>',
  check_b:  '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>',
  shield:   '<svg viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L20 6 V12 C20 17 16 20.5 12 21.5 C8 20.5 4 17 4 12 V6 Z"/><polyline points="9 12 11 14 15 10"/></svg>',
  people:   '<svg viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M5 21 V19 C5 16 8 14 12 14 C16 14 19 16 19 19 V21"/></svg>',
  scales:   '<svg viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><path d="M5 8 L12 6 L19 8"/><path d="M3 14 L7 8 L11 14 M13 14 L17 8 L21 14"/></svg>',
  chat:     '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 H21 V17 H7 L3 21 Z"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="13" x2="13" y2="13"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 V15"/><polyline points="7 11 12 16 17 11"/><line x1="4" y1="19" x2="20" y2="19"/></svg>',
  shield_b: '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L20 6 V12 C20 17 16 20.5 12 21.5 C8 20.5 4 17 4 12 V6 Z"/><polyline points="9 12 11 14 15 10"/></svg>',
  clock:    '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><polyline points="12 8 12 13 16 15"/><line x1="9" y1="3" x2="15" y2="3"/></svg>',
  camera:   '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/></svg>',
  alert:    '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16.5"/></svg>',
  arrow:    '<svg viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="15 6 21 12 15 18"/></svg>',
  phone:    '<svg viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.86 19.86 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.92.31 1.83.57 2.71a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.37-1.13a2 2 0 0 1 2.11-.45c.88.26 1.79.45 2.71.57A2 2 0 0 1 22 16.92z"/></svg>',
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderBrand(b) {
  return `<div class="brand"><div class="mark">${esc(b.wordmark_main)} <em>${esc(b.wordmark_sub)}</em></div><div class="subline">${esc(b.tagline)}</div></div>`;
}
const LAYOUTS = {
  hero: (s, b) => `<div class="frame"><div class="num">${s.n}</div><div class="body"><div class="lede">${esc(s.fields.lede)}</div><h1 class="h1">${esc(s.fields.headline_line1)}<br>${esc(s.fields.headline_line2)}<br>${s.fields.headline_highlight_line === 3 ? `<em>${esc(s.fields.headline_line3)}</em>` : esc(s.fields.headline_line3)}</h1><p class="sub">${esc(s.fields.sub_pre)}<strong>${esc(s.fields.sub_strong)}</strong></p></div><div class="closer">${esc(s.fields.closer)}</div>${renderBrand(b)}</div>`,
  'brutal-truth': (s, b) => `<div class="frame"><div class="num">${s.n}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em>${esc(s.fields.headline_post)}</h1><p class="sub">${esc(s.fields.sub_pre)}<strong>${esc(s.fields.sub_strong)}</strong></p><div class="heading">${esc(s.fields.list_heading)}</div><ul class="x-list">${s.fields.items.map(it => `<li><span class="x-circle">${ICONS.x}</span>${esc(it)}</li>`).join('')}</ul><div class="closer">${esc(s.fields.closer_pre)}<em>${esc(s.fields.closer_highlight)}</em></div>${renderBrand(b)}</div>`,
  'free-guide': (s, b) => `<div class="frame"><div class="num">${s.n}</div><div class="banner-top">${esc(s.fields.top_banner)}</div><div class="caption">${esc(s.fields.caption)}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em>${esc(s.fields.headline_post)}</h1><div class="grid"><div><div class="inside">${esc(s.fields.list_heading)}</div><ul class="check-list">${s.fields.items.map(it => `<li><span class="check-circle">${ICONS.check}</span>${esc(it)}</li>`).join('')}</ul></div><div class="book"><div class="book-title">${s.fields.book_title_lines.map(esc).join('<br>')}</div><div class="book-mark">${esc(s.fields.book_mark)}</div></div></div><div class="closer-banner">${esc(s.fields.closer_banner)}</div>${renderBrand(b)}</div>`,
  'big-stat': (s, b) => `<div class="frame"><div class="num">${s.n}</div><div class="stat-caption">${esc(s.fields.stat_caption)}</div><div class="bignum"><em>${esc(s.fields.stat_currency)}</em>${esc(s.fields.stat_number)}<em>${esc(s.fields.stat_plus)}</em></div><div class="stat-label">${esc(s.fields.stat_label)}</div><div class="badges">${s.fields.badges.map(bd => `<div class="badge"><div class="b-icon">${ICONS[bd.icon] || ICONS.shield}</div><div class="b-label">${esc(bd.label_line1)}<br>${esc(bd.label_line2)}</div></div>`).join('')}</div><p class="body-text">${esc(s.fields.body_pre)}<strong>${esc(s.fields.body_strong)}</strong>${esc(s.fields.body_post)}</p>${renderBrand(b)}</div>`,
  'common-mistakes': (s, b) => `<div class="frame"><div class="num">${s.n}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em></h1><ul class="pill-list">${s.fields.items.map(it => `<li><span class="x-circle">${ICONS.x}</span>${esc(it)}</li>`).join('')}</ul><div class="closer">${esc(s.fields.closer_pre)}<em>${esc(s.fields.closer_highlight)}</em></div>${renderBrand(b)}</div>`,
  'three-steps': (s, b) => `<div class="frame"><div class="num">${s.n}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em></h1><ol class="steps">${s.fields.steps.map(st => `<li><div class="step-num-square">${st.n}</div><div class="step-circle">${ICONS[st.icon] || ICONS.chat}</div><div class="step-body">${esc(st.body_pre)}${st.body_strong1 ? `<strong>${esc(st.body_strong1)}</strong>` : ''}${esc(st.body_mid)}${st.body_strong2 ? `<strong>${esc(st.body_strong2)}</strong>` : ''}${esc(st.body_post)}</div></li>`).join('')}</ol><div class="closer-banner">${esc(s.fields.closer_banner)}</div>${renderBrand(b)}</div>`,
  testimonials: (s, b) => `<div class="frame"><div class="num">${s.n}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em></h1><div class="cards">${s.fields.cards.map(c => `<div class="card"><div class="avatar">${esc(c.initial)}</div><div><div class="stars">★ ★ ★ ★ ★</div><div class="quote">${esc(c.quote)}</div></div></div>`).join('')}</div>${renderBrand(b)}</div>`,
  'why-us': (s, b) => `<div class="frame"><div class="num">${s.n}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em>${esc(s.fields.headline_post)}</h1><ul class="benefit-list">${s.fields.items.map(it => `<li><span class="benefit-check">${ICONS.check_b}</span>${esc(it)}</li>`).join('')}</ul><div class="closer-banner">${esc(s.fields.closer_banner)}</div>${renderBrand(b)}</div>`,
  urgency: (s, b) => `<div class="frame"><div class="num">${s.n}</div><div class="clock-wrap">${ICONS.clock}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em></h1><div class="reasons">${s.fields.reasons.map(r => `<div class="reason"><span class="reason-icon">${ICONS[r.icon] || ICONS.alert}</span>${esc(r.text)}</div>`).join('')}</div><div class="closer">${esc(s.fields.closer_pre)}<em>${esc(s.fields.closer_highlight)}</em></div>${renderBrand(b)}</div>`,
  cta: (s, b) => `<div class="frame"><div class="num">${s.n}</div><h1 class="h1">${esc(s.fields.headline_pre)}<em>${esc(s.fields.headline_highlight)}</em>${esc(s.fields.headline_post)}</h1><div class="offer-block"><span class="offer-caption">${esc(s.fields.offer_caption_pre)}<strong>${esc(s.fields.offer_caption_strong)}</strong>${esc(s.fields.offer_caption_post)}</span><span class="offer-big">${esc(s.fields.offer_big)}</span><span class="offer-detail">${esc(s.fields.offer_detail_pre)}<br><em>${esc(s.fields.offer_detail_em)}</em></span></div><div class="or-call">${esc(s.fields.phone_label)}</div><div class="phone-button">${ICONS.phone}${esc(s.fields.phone_number)}</div>${renderBrand(b)}</div>`,
};

(async () => {
  const params = new URLSearchParams(location.search);
  const carouselId = params.get('id');
  const slideN = parseInt(params.get('slide'), 10);
  if (!carouselId || !slideN) {
    document.body.innerHTML = '<p style="padding:20px;">missing ?id=&slide= params</p>';
    return;
  }
  const res = await fetch('/api/carousel/' + encodeURIComponent(carouselId));
  if (!res.ok) {
    document.body.innerHTML = '<p style="padding:20px;">failed to load: ' + await res.text() + '</p>';
    return;
  }
  const doc = await res.json();
  const slide = doc.slides.find(s => s.n === slideN);
  if (!slide) {
    document.body.innerHTML = '<p style="padding:20px;">no slide ' + slideN + '</p>';
    return;
  }
  slide.idx = doc.slides.indexOf(slide);
  const themeClass = slide.theme === 'dark-deep' ? 'dark deep' : slide.theme;
  const layoutFn = LAYOUTS[slide.layout] || (() => `<div class="frame">unknown layout</div>`);
  document.getElementById('root').innerHTML =
    `<div class="slide ${themeClass}" data-layout="${slide.layout}">${layoutFn(slide, doc.brand)}</div>`;
  // Signal to puppeteer that rendering is done
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
})();
</script>
</body>
</html>
